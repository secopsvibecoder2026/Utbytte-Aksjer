name: Deploy til GitHub Pages (kun deploy)

# Lettvekts-deploy som publiserer main til Pages uten datahenting.
# Utløses av oppdater-priser.yml og ai-oppsummering.yml etter at de har
# committet nye data, slik at priser.json/aksjer.json faktisk når live-siten.
# (Push med GITHUB_TOKEN trigger aldri on:push-workflows; workflow_dispatch
# via API er det dokumenterte unntaket.)
#
# NB: Bumper bevisst IKKE SW-cacheversjonen — JSON-data er network-first i
# service workeren, så klienter får ferske priser uansett. En bump hvert
# 15. minutt ville invalidert alle brukeres statiske cache 4x i timen.

on:
  workflow_dispatch:

permissions:
  pages: write
  id-token: write
  contents: read

concurrency:
  group: "pages-deploy"
  cancel-in-progress: false

jobs:
  deploy:
    name: Deploy main til GitHub Pages
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      # Adressen kommer fra det forsøket som lyktes (se deploy-stegene).
      url: ${{ steps.deployment3.outputs.page_url || steps.deployment2.outputs.page_url || steps.deployment.outputs.page_url }}
    steps:
      - name: Sjekk ut kode
        uses: actions/checkout@v4
        with:
          ref: main

      - name: Konfigurer GitHub Pages
        uses: actions/configure-pages@v5

      # Bare nettstedet, ikke prosjektdokumentene, skriptene og testene.
      # Lista står i _config.yml (se scripts/nettstedfiler.py).
      - name: Samle nettstedet uten interne filer
        run: python3 scripts/nettstedfiler.py "$RUNNER_TEMP/nettsted"

      - name: Last opp artefakt
        uses: actions/upload-pages-artifact@v3
        with:
          path: ${{ runner.temp }}/nettsted

      # Tre forsøk, fordi deploy-pages av og til ikke finner artefakten rett
      # etter opplasting (se forklaringen i update-og-deploy.yml).
      - name: Deploy til GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
        continue-on-error: true

      - name: Vent før forsøk 2
        if: steps.deployment.outcome == 'failure'
        run: sleep 20

      - name: Deploy til GitHub Pages (forsøk 2)
        id: deployment2
        if: steps.deployment.outcome == 'failure'
        uses: actions/deploy-pages@v4
        continue-on-error: true

      - name: Vent før forsøk 3
        if: steps.deployment.outcome == 'failure' && steps.deployment2.outcome == 'failure'
        run: sleep 60

      - name: Deploy til GitHub Pages (forsøk 3)
        id: deployment3
        if: steps.deployment.outcome == 'failure' && steps.deployment2.outcome == 'failure'
        uses: actions/deploy-pages@v4
