name: Oppdater aksjedata og deploy

on:
  push:
    branches: [main]
    paths-ignore:
      - 'data/aksjer.json'   # unngå loop når auto-commit oppdaterer data
      - 'data/priser.json'   # priser oppdateres av egen workflow
  schedule:
    # Kjør hverdager 4× daglig: 07:00, 10:00, 13:00, 16:00 UTC
    - cron: "0 7 * * 1-5"
    - cron: "0 10 * * 1-5"
    - cron: "0 13 * * 1-5"
    - cron: "0 16 * * 1-5"
  workflow_dispatch:  # Tillat manuell kjøring

permissions:
  contents: write
  pages: write
  id-token: write
  issues: write   # for varsling om utdaterte tickere

jobs:
  oppdater-data:
    name: Hent og oppdater aksjedata
    runs-on: ubuntu-latest
    # Kun kjøres på schedule og manuell trigger – ikke ved vanlig push
    if: github.event_name == 'schedule' || github.event_name == 'workflow_dispatch'
    # Egen gruppe, atskilt fra Pages-deploy: en priscommit (som trigger
    # deploy-only.yml) skal aldri kunne kansellere en pågående datahenting her.
    concurrency:
      group: "aksjedata-fetch"
      cancel-in-progress: true
    steps:
      - name: Sjekk ut kode
        uses: actions/checkout@v4

      - name: Sett opp Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: "pip"
          cache-dependency-path: scripts/requirements.txt

      - name: Installer avhengigheter
        run: pip install -r scripts/requirements.txt

      - name: Hent aksjedata fra Yahoo Finance
        run: python scripts/fetch_stocks.py

      - name: Valider datakvalitet
        run: python scripts/valider_data.py

      - name: Sjekk etter utdaterte aksjer
        # Avnoteringer, navneendringer og oppkjøp. Blokkerer bevisst ikke
        # deployen — et omdøpt selskap skal ikke stanse kursoppdateringene.
        # Varsler havner i jobbsammendraget og i GitHub-issuet under.
        run: python scripts/sjekk_utdaterte.py

      - name: Oppdater hendelseskalender
        run: python scripts/oppdater_hendelser.py

      - name: Commit og push oppdatert data
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add data/aksjer.json data/hendelser.json aksjer/ sitemap.xml index.html app/
          # Legges til enkeltvis: mangler én av dem (f.eks. fordi kontrollen
          # feilet), skal ikke hele datacommiten ryke på en `git add`-feil.
          for f in data/hentelogg.json data/ticker_status.json data/ticker_varsler.json; do
            if [ -f "$f" ]; then git add "$f"; fi
          done
          if git diff --staged --quiet; then
            echo "Ingen endringer."
          else
            git commit -m "auto: oppdater aksjedata og aksjesider $(date -u '+%Y-%m-%d %H:%M UTC')"
            git pull --rebase origin main
            git push
          fi

      - name: Varsle om utdaterte aksjer
        # Holder ett enkelt issue oppdatert i stedet for å lage et nytt per
        # kjøring, og lukker det automatisk når alle kritiske varsler er borte.
        if: always()
        env:
          GH_TOKEN: ${{ github.token }}
          TITTEL: "Utdaterte aksjer oppdaget i tickers.json"
          ETIKETT: "utdaterte-aksjer"
        run: |
          set -euo pipefail
          if [ ! -f data/ticker_varsler.json ]; then
            echo "Ingen varselfil — hopper over."
            exit 0
          fi
          ANTALL=$(python -c "import json;print(json.load(open('data/ticker_varsler.json')).get('antall_kritiske',0))")
          EKSISTERENDE=$(gh issue list --state open --label "$ETIKETT" \
                          --json number --jq '.[0].number // empty' || true)

          if [ "$ANTALL" -eq 0 ]; then
            if [ -n "$EKSISTERENDE" ]; then
              gh issue close "$EKSISTERENDE" \
                --comment "Alle kritiske varsler er borte. Lukkes automatisk."
              echo "Lukket issue #$EKSISTERENDE."
            else
              echo "Ingen kritiske varsler."
            fi
            exit 0
          fi

          python scripts/sjekk_utdaterte.py --issue-tekst > /tmp/issue.md
          gh label create "$ETIKETT" --color D93F0B \
            --description "Ticker ser avnotert, omdøpt eller duplisert ut" 2>/dev/null || true

          if [ -n "$EKSISTERENDE" ]; then
            gh issue edit "$EKSISTERENDE" --body-file /tmp/issue.md
            echo "Oppdaterte issue #$EKSISTERENDE ($ANTALL kritiske)."
          else
            gh issue create --title "$TITTEL" --label "$ETIKETT" --body-file /tmp/issue.md
            echo "Opprettet nytt issue ($ANTALL kritiske)."
          fi

  deploy-pages:
    name: Deploy til GitHub Pages
    # Ved push: kjør direkte. Ved schedule/dispatch: kjør etter data-oppdatering
    needs: [oppdater-data]
    if: |
      always() &&
      (needs.oppdater-data.result == 'success' ||
       needs.oppdater-data.result == 'skipped') &&
      github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    # Delt med deploy-only.yml: overlappende deploy-forespørsler skal køes
    # (ikke kansellere hverandre eller la deploy-pages time ut mot Pages-API).
    concurrency:
      group: "pages-deploy"
      cancel-in-progress: false
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Sjekk ut kode
        uses: actions/checkout@v4
        with:
          ref: main  # Alltid deploy fra main, inkl. eventuelle auto-commits

      - name: Bump SW cache-versjon
        run: |
          SHA=$(git rev-parse --short HEAD)
          sed -i "s/const CACHE = 'exday-v[^']*'/const CACHE = 'exday-v$SHA'/" sw.js

      - name: Konfigurer GitHub Pages
        uses: actions/configure-pages@v5

      - name: Last opp artefakt
        uses: actions/upload-pages-artifact@v3
        with:
          path: "."

      - name: Deploy til GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
